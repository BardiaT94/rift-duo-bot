<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#313244"/>
      <stop offset="0.6" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4befe"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4befe" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cdd6f4" stroke-opacity="0.05" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- support: shield -->
  <path d="M256 92 L384 138 V246 C384 330 328 386 256 420 C184 386 128 330 128 246 V138 Z"
        fill="url(#shieldFill)" stroke="url(#shield)" stroke-width="22" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- ADC: crosshair -->
  <g stroke="#94e2d5" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#glow)">
    <circle cx="256" cy="252" r="62"/>
    <line x1="256" y1="160" x2="256" y2="204"/>
    <line x1="256" y1="300" x2="256" y2="344"/>
    <line x1="164" y1="252" x2="208" y2="252"/>
    <line x1="304" y1="252" x2="348" y2="252"/>
  </g>
  <circle cx="256" cy="252" r="14" fill="#f9e2af" filter="url(#glow)"/>
</svg>
